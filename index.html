<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一二布布工作台</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一二布布">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f4f1ea; --surface:#fbf9f3; --surface-2:#f0ece2;
  --ink:#2c2823; --ink-soft:#5b554c; --muted:#938b7d;
  --line:#e3ddd0; --line-strong:#d3cab9;
  --accent:#b06a47; --accent-soft:#c98b6c; --sage:#5f7a6e; --gold:#bb9a4e;
  --pos:#4f7d59; --neg:#bd5638; --warn:#c08a2e;
  --shadow:0 1px 2px rgba(44,40,35,.04),0 8px 24px rgba(44,40,35,.05);
  --radius:14px;
  --serif:"Songti SC","STSong",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{
  --bg:#1b1916; --surface:#242019; --surface-2:#2c281f;
  --ink:#ece6d8; --ink-soft:#b3ab9b; --muted:#857c6e;
  --line:#34302a; --line-strong:#423c33;
  --accent:#c98b6c; --accent-soft:#b06a47; --sage:#7e988b; --gold:#cdb066;
  --pos:#7fae87; --neg:#d77a5c; --warn:#d9a64a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
/* ============ 布局 ============ */
.app{display:flex; min-height:100vh;}
.side{
  width:236px; flex:0 0 236px; background:var(--surface);
  border-right:1px solid var(--line); padding:26px 16px;
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column;
}
.brand{display:flex; align-items:center; gap:12px; padding:0 8px 22px;}
.brand .mark{
  width:44px;height:44px;border-radius:50%; flex:0 0 44px;
  background:linear-gradient(135deg,var(--accent),var(--accent-soft));
  color:#fff; font-family:var(--serif); font-size:24px; font-weight:600;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.brand .name{font-family:var(--serif); font-size:19px; letter-spacing:1px;}
.brand .sub{font-size:11px; color:var(--muted); letter-spacing:2px; margin-top:1px;}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav button{
  display:flex;align-items:center;gap:11px; padding:11px 13px;border:none;
  background:transparent;color:var(--ink-soft);font-size:14.5px;cursor:pointer;
  border-radius:10px; text-align:left; font-family:var(--sans); width:100%;
  transition:background .15s,color .15s;
}
.nav button svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.7;}
.nav button:hover{background:var(--surface-2);color:var(--ink);}
.nav button.active{background:var(--surface-2);color:var(--accent);font-weight:600;}
.nav button.active svg{stroke:var(--accent);}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
.side-foot button{
  border:none;background:transparent;color:var(--muted);font-size:12.5px;
  cursor:pointer;padding:8px 13px;border-radius:9px;text-align:left;
}
.side-foot button:hover{background:var(--surface-2);color:var(--ink);}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.topbar h1{font-family:var(--serif);font-size:23px;margin:0;font-weight:600;letter-spacing:.5px;}
.topbar .date{font-size:12.5px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
.top-actions{display:flex;gap:8px;align-items:center;}
.content{padding:24px 28px 90px;max-width:1080px;width:100%;margin:0 auto;}
/* ============ 通用组件 ============ */
.btn{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:9px 15px;border-radius:10px;font-size:13.5px;cursor:pointer;font-family:var(--sans);
  transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted);}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px;}
.btn.icon{padding:8px;width:38px;height:38px;justify-content:center;}
.iconbtn{border:none;background:transparent;cursor:pointer;color:var(--muted);padding:5px;border-radius:7px;}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.panel + .panel{margin-top:22px;}
.panel h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:600;letter-spacing:.5px;}
.panel .desc{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;}
label{font-size:12.5px;color:var(--ink-soft);display:block;margin-bottom:5px;letter-spacing:.3px;}
input,select,textarea{
  font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;width:100%;
  transition:border .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:60px;}
.form-row{display:flex;gap:12px;flex-wrap:wrap;}
.form-row > div{flex:1;min-width:120px;}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}
.inline-form > div{display:flex;flex-direction:column;}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--ink-soft);letter-spacing:.3px;}
.tag.io-in{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos);}
.tag.io-out{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg);}
.tag.sage{background:color-mix(in srgb,var(--sage) 16%,transparent);color:var(--sage);}
.tag.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.amt-in{color:var(--pos);font-variant-numeric:tabular-nums;}
.amt-out{color:var(--neg);font-variant-numeric:tabular-nums;}
.num{font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px;}
/* stat 排版 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);}
.stat .v{font-family:var(--serif);font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.4px;}
.stat .v small{font-size:14px;color:var(--muted);}
/* 进度条 */
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:8px;}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s;}
.bar.over > i{background:var(--neg);}
/* 今日处理 */
.todo-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:10px;}
.todo-item.overdue{border-color:color-mix(in srgb,var(--neg) 45%,var(--line));background:color-mix(in srgb,var(--neg) 5%,var(--surface));}
.todo-item .t{font-size:14.5px;flex:1;min-width:0;}
.todo-item .meta{font-size:12px;color:var(--muted);}
.todo-item .due{font-size:11.5px;color:var(--neg);font-weight:600;}
/* 热力图 */
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;}
.heat.single{grid-template-columns:repeat(30,1fr);gap:3px;}
.cell{aspect-ratio:1;border-radius:3px;background:var(--surface-2);}
/* 习惯 */
.habit{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin-bottom:12px;flex-wrap:wrap;}
.habit .info{flex:1;min-width:140px;}
.habit .nm{font-size:15.5px;font-weight:560;}
.habit .meta{font-size:12px;color:var(--muted);margin-top:3px;}
.habit .acts{display:flex;gap:8px;align-items:center;}
.chip{font-size:11px;padding:2px 8px;border-radius:14px;border:1px solid var(--line-strong);color:var(--ink-soft);}
.dash-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap;}
.gauge-wrap{position:relative;width:150px;height:150px;flex:0 0 150px;}
.gauge-wrap .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge-wrap .lbl .score{font-family:var(--serif);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;}
.gauge-wrap .lbl .state{font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:1px;}
/* 媒体封面墙 */
.cover-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px;}
.cover{aspect-ratio:3/4;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .15s;}
.cover:hover{transform:translateY(-3px);}
.cover .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:9px;color:#fff;font-family:var(--serif);font-size:14px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover .badge{position:absolute;top:6px;left:6px;font-size:10px;background:rgba(0,0,0,.5);color:#fff;padding:2px 6px;border-radius:6px;}
.cover .star{position:absolute;top:6px;right:6px;font-size:11px;color:#ffd479;background:rgba(0,0,0,.5);padding:2px 5px;border-radius:6px;}
.list-row{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
.list-row:last-child{border-bottom:none;}
.list-row .ph{width:46px;height:62px;border-radius:7px;flex:0 0 46px;display:flex;align-items:flex-end;padding:5px;color:#fff;font-family:var(--serif);font-size:12px;overflow:hidden;}
.list-row .body{flex:1;min-width:0;}
.list-row .tt{font-size:15px;font-weight:560;}
.list-row .rv{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;}
/* 周计划 */
.plan-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.plan-day{background:var(--surface-2);border-radius:11px;padding:11px;min-height:120px;}
.plan-day h4{margin:0 0 8px;font-size:13px;color:var(--accent);letter-spacing:.5px;text-align:center;}
.plan-day ul{list-style:none;padding:0;margin:0 0 8px;font-size:12.5px;}
.plan-day li{display:flex;gap:6px;align-items:flex-start;margin-bottom:5px;color:var(--ink-soft);}
.plan-day li button{border:none;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:13px;line-height:1.3;}
/* 提示/弹层 */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:100;max-width:90vw;box-shadow:var(--shadow);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:#8d2f1f;color:#fff;}
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:26px;max-width:420px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line);}
.modal h3{font-family:var(--serif);margin:0 0 10px;font-size:20px;}
.modal p{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0 0 18px;}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.banner{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:13.5px;margin-bottom:20px;}
.banner .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:18px;margin-left:auto;}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;}
.seg button{border:none;background:transparent;padding:7px 13px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:var(--sans);}
.seg button.on{background:var(--accent);color:#fff;}
.hidden{display:none!important;}
.foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;letter-spacing:.5px;}
/* 移动端 */
@media(max-width:860px){
  .side{display:none;}
  .main{flex:1;}
  .content{padding:18px 16px 96px;}
  .topbar{padding:14px 16px;}
  .topbar h1{font-size:19px;}
  .top-actions .btn span{display:none;}
  .top-actions .btn{padding:8px;}
  .plan-grid{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    overflow-x:auto;}
  .mobile-nav button{flex:1 0 auto;min-width:58px;border:none;background:transparent;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;cursor:pointer;padding:5px 2px;}
  .mobile-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;}
  .mobile-nav button.active{color:var(--accent);}
  .heat{font-size:0;}
}
@media(min-width:861px){.mobile-nav{display:none;}}
/* 团队空间（多人共用） */
.rows{display:flex;flex-direction:column;gap:8px;}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);}
.row .ck{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0;}
.row .ck span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row.done .ck span{text-decoration:line-through;color:var(--muted);}
.exp{color:var(--neg);font-weight:600;} .inc{color:var(--pos);font-weight:600;}
.stat b{display:block;font-size:19px;} .stat span{font-size:11.5px;color:var(--muted);}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:6px;}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);}
.photo img{width:100%;height:96px;object-fit:cover;display:block;}
.photo-cap{padding:5px 7px;font-size:11px;color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="side">
    <div class="brand">
      <div class="mark">布</div>
      <div><div class="name">一二布布</div><div class="sub">L I F E&nbsp;&nbsp;D E S K</div></div>
    </div>
    <nav class="nav" id="nav">
      <button data-sec="dash" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>今日</button>
      <button data-sec="ledger"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M3 12h18"/></svg>记账理财</button>
      <button data-sec="habits"><svg viewBox="0 0 24 24"><path d="M12 21c-5-3-8-6-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-3 7-8 10z"/></svg>习惯健康</button>
      <button data-sec="fitness"><svg viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>减脂健身</button>
      <button data-sec="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>日程统筹</button>
      <button data-sec="shopping"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 13h12l2-9H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>待买清单</button>
      <button data-sec="media"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>书影音</button>
      <button data-sec="team"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>我们的空间</button>
    </nav>
    <div class="side-foot">
      <button id="btnBackup">↧ 导出备份</button>
      <button id="btnImport">↥ 导入恢复</button>
      <button id="btnTheme">◐ 切换主题</button>
      <button id="btnClearDemo">✦ 清空示例数据</button>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="secTitle">今日</h1>
        <div class="date" id="todayDate"></div>
      </div>
      <div class="top-actions">
        <span id="acctChip"></span>
        <button class="btn sm primary" id="topInstall" onclick="installApp()">＋安装App</button>
        <button class="btn sm" id="topBackup">↧ 备份</button>
        <button class="btn sm" id="topImport">↥ 导入</button>
        <button class="btn icon" id="topTheme" title="切换主题"><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
      </div>
    </div>
    <div class="content" id="content"><!-- 各模块渲染区 --></div>
  </div>
</div>

<!-- 移动端底部导航 -->
<nav class="mobile-nav" id="mobileNav">
  <button data-sec="dash" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>今日</button>
  <button data-sec="ledger"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3z"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M3 12h18"/></svg>记账</button>
  <button data-sec="habits"><svg viewBox="0 0 24 24"><path d="M12 21c-5-3-8-6-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-3 7-8 10z"/></svg>习惯</button>
  <button data-sec="fitness"><svg viewBox="0 0 24 24"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>健身</button>
  <button data-sec="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>日程</button>

  <button data-sec="media"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>收藏</button>

<script>
"use strict";
/* ===================== 基础工具 ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KEY='wb_life_data', KEY_ADD='wb_life_addcount', KEY_THEME='wb_life_theme';
const TODAY=()=>new Date().toISOString().slice(0,10);
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function monthKey(s){return s.slice(0,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return (n<0?'-':'')+'¥'+Math.abs(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
const EXP_CATS=['餐饮','交通','购物','居住','娱乐','医疗','学习','其他'];
const INC_CATS=['工资','兼职','理财','红包','其他'];
const CAT_COLOR=['#b06a47','#5f7a6e','#bb9a4e','#7a6a8f','#4a7c89','#bd5638','#6b8f71','#938b7d'];
function catColor(c){let i=EXP_CATS.indexOf(c);if(i<0)i=INC_CATS.indexOf(c);return CAT_COLOR[i%CAT_COLOR.length];}
function skipDemo(arr){return (arr||[]).filter(x=>!x._demo);}

/* ===================== 存储层（含损坏/失败处理） ===================== */
let DB=null, CORRUPT=false;
function defaultDB(){
  return {ledger:[],budget:2500,habits:[],fitness:[],plan:{1:[],2:[],3:[],4:[],5:[],6:[],7:[]},schedule:[],shopping:[],media:[],_demo:true};
}
function demoData(){
  const t=TODAY(), pm=addDays(t,-32);
  const mk=(o)=>Object.assign({_demo:true,id:uid()},o);
  return {
    budget:2500, _demo:true,
    ledger:[
      mk({date:addDays(t,-1),io:'out',cat:'餐饮',amount:38,note:'午饭'}),
      mk({date:addDays(t,-3),io:'out',cat:'交通',amount:12,note:'地铁'}),
      mk({date:addDays(t,-6),io:'out',cat:'购物',amount:199,note:'日用品'}),
      mk({date:addDays(t,-10),io:'in',cat:'兼职',amount:800,note:'稿费'}),
      mk({date:addDays(t,-2),io:'out',cat:'餐饮',amount:65,note:'聚餐'}),
      mk({date:pm.slice(0,8)+'15',io:'out',cat:'餐饮',amount:1200,note:'上月餐饮合计'}),
      mk({date:pm.slice(0,8)+'20',io:'in',cat:'工资',amount:9000,note:'上月工资'}),
    ],
    habits:[
      mk({name:'晨间拉伸',type:'check',target:1,unit:'次',records:recGen(t,['check'])}),
      mk({name:'喝水',type:'count',target:8,unit:'杯',records:recGen(t,['count'])}),
      mk({name:'阅读',type:'number',target:30,unit:'分钟',records:recGen(t,['number'])}),
    ],
    fitness:[
      mk({date:addDays(t,-12),weight:72.5,fat:24.1,ci:1900,co:2100}),
      mk({date:addDays(t,-8),weight:72.1,fat:23.8,ci:1850,co:2300}),
      mk({date:addDays(t,-4),weight:71.6,fat:23.5,ci:1800,co:2200}),
      mk({date:addDays(t,-1),weight:71.2,fat:23.2,ci:1750,co:2400}),
    ],
    plan:{1:[mk({text:'慢跑 30 分钟'})],2:[mk({text:'核心训练'})],3:[],4:[mk({text:'骑行'})],5:[],6:[mk({text:'瑜伽'})],7:[]},
    schedule:[
      mk({date:addDays(t,-2),time:'10:00',title:'缴物业费',note:'物业APP',done:false}),
      mk({date:t,time:'14:30',title:'和医生复诊',note:'带体检报告',done:false}),
      mk({date:addDays(t,2),time:'19:00',title:'朋友聚餐',note:'老地方',done:false}),
    ],
    shopping:[
      mk({name:'洗衣液',cat:'日用',bought:false}),
      mk({name:'《置身事内》',cat:'书',bought:false}),
      mk({name:'运动鞋',cat:'服饰',bought:true}),
    ],
    media:[
      mk({type:'book',title:'置身事内',status:'ing',star:4,review:'讲透中国经济治理逻辑',date:addDays(t,-20),cover:''}),
      mk({type:'movie',title:'奥本海默',status:'done',star:5,review:'宏大的叙事与克制',date:addDays(t,-15),cover:''}),
      mk({type:'music',title:'千寻',status:'wish',star:0,review:'',date:addDays(t,-5),cover:''}),
    ],
  };
}
function recGen(t,types){
  const r={};const arr=['check','count','number'];
  for(let i=1;i<=24;i++){const d=addDays(t,-i);const ty=types[i%types.length];
    if(ty==='check')r[d]=(i%3===0?0:1);
    else if(ty==='count')r[d]=Math.min(8,1+((i*3)%8));
    else r[d]=Math.min(60,10+((i*7)%50));}
  return r;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw===null){DB=demoData();save(true);return true;}
    const obj=JSON.parse(raw);
    if(!obj||typeof obj!=='object')throw new Error('格式错误');
    DB=migrate(obj);
    return true;
  }catch(e){CORRUPT=true;DB=defaultDB();return false;}
}
function migrate(o){
  const d=defaultDB();
  for(const k in d){if(!(k in o))o[k]=d[k];}
  if(!o.plan)o.plan=d.plan;
  for(let i=1;i<=7;i++)if(!Array.isArray(o.plan[i]))o.plan[i]=[];
  ['ledger','habits','fitness','schedule','shopping','media'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
  return o;
}
function save(silent){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}
  catch(e){
    toast('保存失败：浏览器禁用了本地存储或空间已满，请检查后重试','err');
    return false;
  }
  if(online()&&!SYNC.suppress){SYNC.dirty=true;schedulePush();}
  return true;
}
/* ===================== 云同步（多设备互通） ===================== */
/* 两种模式：
 *  gist  ：用 GitHub 私密便签(Gist)当云仓库，免服务器，推荐（默认）
 *  server：自建 Node 后端（见 sync-server/），适合想自己掌控/多人共享
 */
const GIST_FILE='qi-life-workbench-data.json';
const GIST_DESC='qi-life-workbench-sync-store';
const SYNC={
  provider:localStorage.getItem('wb_sync_provider')||'gist',
  gistToken:localStorage.getItem('wb_gist_token')||'',
  gistId:localStorage.getItem('wb_gist_id')||'',
  pass:localStorage.getItem('wb_gist_pass')||'',
  gistRev:'',lastPushContent:'',
  serverApi:localStorage.getItem('wb_life_sync_api')||'',
  token:localStorage.getItem('wb_life_token')||'',
  user:localStorage.getItem('wb_life_user')||'',
  updatedAt:0,
  status:'idle',dirty:false,suppress:false,timer:null,pushT:null
};
function online(){return SYNC.provider==='gist'?(!!SYNC.gistId):(!!SYNC.token);}
function syncSetProvider(p){SYNC.provider=p;localStorage.setItem('wb_sync_provider',p);renderSyncBox();}
function syncSetApi(u){SYNC.serverApi=(u||'').trim().replace(/\/+$/,'');localStorage.setItem('wb_life_sync_api',SYNC.serverApi);renderSyncBox();}
function gistHeaders(){return{'Authorization':'Bearer '+SYNC.gistToken,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'qi-life-workbench'};}
function gh(path,opts={}){opts.headers=Object.assign(gistHeaders(),opts.headers||{});return fetch('https://api.github.com'+path,opts);}
/* 端到端加密：同步密码 → PBKDF2 → AES-GCM。明文不出本机，连 GitHub 也只见密文 */
async function deriveKey(pass){
  const enc=new TextEncoder();
  const mat=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('qi-life-sync'),iterations:100000,hash:'SHA-256'},mat,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptObj(obj,pass){
  const key=await deriveKey(pass);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
  return b64(ct)+'.'+b64(iv);
}
async function decryptObj(str,pass){
  const [c,b]=str.split('.');
  const bin=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
  const key=await deriveKey(pass);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(b)},key,bin(c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function gistContent(obj){return SYNC.pass?('ENC:'+await encryptObj(obj,SYNC.pass)):JSON.stringify(obj);}
async function gistParse(gist){
  const f=gist.files&&gist.files[GIST_FILE];if(!f||!f.content)return null;
  const c=f.content;
  if(c.startsWith('ENC:')){
    if(!SYNC.pass){toast('需要同步密码才能解密','err');return null;}
    try{return await decryptObj(c.slice(4),SYNC.pass);}catch(e){toast('同步密码错误','err');return null;}
  }
  try{return JSON.parse(c);}catch(e){return null;}
}
async function gistConnect(){
  if(!SYNC.gistToken){toast('请先粘贴 GitHub 令牌','err');return;}
  try{
    if(!SYNC.gistId){
      // 先找同令牌账号下是否已有同步仓库（避免每台设备各建一个、数据不通）
      const list=await gh('/gists?per_page=100').then(r=>r.ok?r.json():[]).catch(()=>[]);
      const found=(list||[]).find(g=>(g.description===GIST_DESC)||(g.files&&g.files[GIST_FILE]));
      if(found){
        SYNC.gistId=found.id;localStorage.setItem('wb_gist_id',found.id);
        toast('已找到已有云端仓库，直接连接');
      }else{
        const body=JSON.stringify({public:false,description:GIST_DESC,files:{[GIST_FILE]:{content:await gistContent(DB)}}});
        const r=await gh('/gists',{method:'POST',body});
        if(!r.ok){const e=await r.json().catch(()=>({}));toast('连接失败：'+(e.message||r.status),'err');return;}
        const j=await r.json();SYNC.gistId=j.id;localStorage.setItem('wb_gist_id',j.id);
        toast('已创建云端仓库并连接');
      }
      SYNC.gistRev='';SYNC.lastPushContent='';
    }else{
      const r=await gh('/gists/'+SYNC.gistId);if(!r.ok){toast('令牌无效或仓库丢失','err');return;}
      const j=await r.json();SYNC.gistRev=j.history&&j.history[0]?j.history[0].version:'';
    }
    SYNC.status='已同步';renderAcct();renderSyncBox();syncPull();
  }catch(e){toast('网络错误：'+(e.message||''),'err');}
}
async function gistPull(){
  if(!SYNC.gistId)return;
  try{SYNC.status='同步中';renderAcct();
    const r=await gh('/gists/'+SYNC.gistId);if(!r.ok)return;
    const j=await r.json();const rev=j.history&&j.history[0]?j.history[0].version:'';
    const data=await gistParse(j);
    if(rev!==SYNC.gistRev){
      if(SYNC.dirty){conflictModal(data,rev,'gist');}
      else if(data){SYNC.suppress=true;DB=data;save(true);SYNC.suppress=false;SYNC.gistRev=rev;SYNC.lastPushContent=JSON.stringify(data);SYNC.dirty=false;renderAll();}
    }
    SYNC.status='已同步';renderAcct();
  }catch(e){SYNC.status='离线';renderAcct();}
}
async function gistPush(){
  if(!SYNC.gistId||SYNC.suppress)return;
  try{
    const cur=await gh('/gists/'+SYNC.gistId).then(r=>r.ok?r.json():null);
    const curRev=cur&&cur.history&&cur.history[0]?cur.history[0].version:'';
    if(curRev&&curRev!==SYNC.gistRev){
      const remoteContent=cur&&cur.files&&cur.files[GIST_FILE]?cur.files[GIST_FILE].content:'';
      if(remoteContent!==SYNC.lastPushContent){conflictModal(await gistParse(cur),curRev,'gist');return;}
    }
    const content=await gistContent(DB);
    const r=await gh('/gists/'+SYNC.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content}}})});
    if(!r.ok){SYNC.status='离线';renderAcct();return;}
    const j=await r.json();SYNC.gistRev=j.history&&j.history[0]?j.history[0].version:'';SYNC.lastPushContent=content;SYNC.dirty=false;SYNC.status='已同步';renderAcct();
  }catch(e){SYNC.status='离线';renderAcct();}
}
function gistDisconnect(){SYNC.gistToken='';SYNC.gistId='';localStorage.removeItem('wb_gist_token');localStorage.removeItem('wb_gist_id');syncStop();SYNC.status='idle';renderAcct();renderSyncBox();toast('已断开 GitHub 同步');}

/* ---- 自建服务器模式（复用之前实现）---- */
function syncBase(){return SYNC.serverApi||location.origin;}
async function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(SYNC.token)opts.headers.Authorization='Bearer '+SYNC.token;return fetch(syncBase()+path,opts);}
async function syncRegister(u,p,code){if(!u||!p){toast('请输入用户名和密码','err');return;}try{const r=await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p,inviteCode:code||undefined})});if(!r.ok){const e=await r.json().catch(()=>({}));toast('注册失败：'+(e.error||r.status),'err');return;}const j=await r.json();SYNC.token=j.token;SYNC.user=u;localStorage.setItem('wb_life_token',j.token);localStorage.setItem('wb_life_user',u);await afterLogin();toast('注册并登录成功');}catch(e){toast('网络错误：'+(e.message||''),'err');}}
async function syncLogin(u,p){if(!u||!p){toast('请输入用户名和密码','err');return;}try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p})});if(!r.ok){const e=await r.json().catch(()=>({}));toast('登录失败：'+(e.error||r.status),'err');return;}const j=await r.json();SYNC.token=j.token;SYNC.user=u;localStorage.setItem('wb_life_token',j.token);localStorage.setItem('wb_life_user',u);await afterLogin();toast('登录成功');}catch(e){toast('网络错误：'+(e.message||''),'err');}}
async function afterLogin(){SYNC.status='同步中';renderAcct();renderSyncBox();await serverPull();await teamLoad();syncStart();syncShareStart();}
function syncLogout(){if(SYNC.token){api('/api/logout',{method:'POST'}).catch(()=>{});}SYNC.token='';SYNC.user='';SYNC.inviteCode='';SYNC.members=[];localStorage.removeItem('wb_life_token');localStorage.removeItem('wb_life_user');syncStop();syncShareStop();renderAcct();renderSyncBox();if(curSec==='team')renderSec();toast('已退出团队');}
async function serverPull(){if(!SYNC.token)return;try{SYNC.status='同步中';renderAcct();const r=await api('/api/data');if(!r.ok)return;const j=await r.json();if(j.updatedAt!==SYNC.updatedAt){SYNC.suppress=true;DB=j.data;save(true);SYNC.suppress=false;SYNC.updatedAt=j.updatedAt;renderAll();}SYNC.status='已同步';renderAcct();}catch(e){SYNC.status='离线';renderAcct();}}
async function pushNow(){if(SYNC.suppress)return;if(SYNC.provider==='gist')return gistPush();if(!SYNC.token)return;try{const r=await api('/api/data',{method:'PUT',body:JSON.stringify({data:DB,baseUpdatedAt:SYNC.updatedAt})});if(r.ok){const j=await r.json();SYNC.updatedAt=j.updatedAt;SYNC.status='已同步';renderAcct();}else if(r.status===409){const j=await r.json().catch(()=>({}));conflictModal(j.serverData,j.serverUpdatedAt,'server');}}catch(e){SYNC.status='离线';renderAcct();}}
async function syncPull(){if(SYNC.provider==='gist')return gistPull();return serverPull();}
function schedulePush(){if(online()){clearTimeout(SYNC.pushT);SYNC.pushT=setTimeout(pushNow,1200);}}
function conflictModal(serverData,serverRev,kind){
  modal(`<h3>同步冲突</h3><p>另一台设备已更新数据。请选择以哪份为准：</p>
    <div class="acts" style="justify-content:flex-start;gap:10px">
      <button class="btn primary" id="cf_local">用本机覆盖云端</button>
      <button class="btn" id="cf_cloud">拉取云端覆盖本机</button>
      <button class="btn ghost" onclick="closeModal()">稍后处理</button></div>`);
  $('#cf_local').onclick=async()=>{closeModal();if(kind==='gist'){SYNC.dirty=true;await gistPush();}else{const r=await api('/api/data',{method:'PUT',body:JSON.stringify({data:DB,baseUpdatedAt:serverRev})});if(r.ok){const j=await r.json();SYNC.updatedAt=j.updatedAt;SYNC.status='已同步';renderAcct();toast('已用本机覆盖云端');}}};
  $('#cf_cloud').onclick=async()=>{closeModal();SYNC.suppress=true;DB=serverData||{};save(true);SYNC.suppress=false;if(kind==='gist'){SYNC.gistRev=serverRev;SYNC.lastPushContent=JSON.stringify(serverData||{});}else{SYNC.updatedAt=serverRev;}renderAll();SYNC.status='已同步';renderAcct();toast('已拉取云端覆盖本机');};
}
function syncStart(){syncStop();SYNC.timer=setInterval(syncPull,12000);}
function syncStop(){if(SYNC.timer){clearInterval(SYNC.timer);SYNC.timer=null;}}
function renderAcct(){const el=$('#acctChip');if(!el)return;const on=SYNC.provider==='gist'?!!SYNC.gistId:!!SYNC.token;el.innerHTML=on?`<span class="tag sage" title="已开启云同步">☁ ${SYNC.provider==='gist'?'GitHub':esc(SYNC.user)}</span>`:`<span class="tag">未同步</span>`;}

/* ===================== 团队空间（多人共用） ===================== */
const SHARE_KEY='wb_life_share';
let SHARE=loadShare();
let TEAM_TAB='todo';
function loadShare(){try{return JSON.parse(localStorage.getItem(SHARE_KEY))||{todos:[],ledger:[],album:[]};}catch(e){return{todos:[],ledger:[],album:[]};}}
function saveShareLocal(){try{localStorage.setItem(SHARE_KEY,JSON.stringify(SHARE));}catch(e){}}
function saveShareNow(){saveShareLocal();if(SYNC.token)scheduleSharePush();}
let SHARE_PUSH_T=null;
function scheduleSharePush(){clearTimeout(SHARE_PUSH_T);SHARE_PUSH_T=setTimeout(pushShareNow,1200);}
async function pushShareNow(){if(!SYNC.token)return;try{const r=await api('/api/share',{method:'PUT',body:JSON.stringify({data:SHARE,baseUpdatedAt:SYNC.shareRev||0})});if(r.ok){const j=await r.json();SYNC.shareRev=j.updatedAt;}else if(r.status===409){const j=await r.json().catch(()=>({}));SYNC.shareRev=j.serverUpdatedAt;SHARE=j.serverData||SHARE;saveShareLocal();toast('公共空间与云端冲突，已采用云端版本');renderSec();}}catch(e){}}
async function pullShare(){if(!SYNC.token)return;try{const r=await api('/api/share');if(!r.ok)return;const j=await r.json();SYNC.shareRev=j.updatedAt;SHARE=j.data||{todos:[],ledger:[],album:[]};saveShareLocal();if(curSec==='team')renderSec();}catch(e){}}
function syncShareStart(){syncShareStop();SYNC.shareTimer=setInterval(pullShare,12000);}
function syncShareStop(){if(SYNC.shareTimer){clearInterval(SYNC.shareTimer);SYNC.shareTimer=null;}}
async function teamLoad(){if(!SYNC.token)return;try{const r=await api('/api/me');if(!r.ok)return;const j=await r.json();SYNC.inviteCode=j.inviteCode;SYNC.members=j.members;SYNC.isCreator=j.isCreator;await pullShare();renderAcct();if(curSec==='team')renderSec();}catch(e){}}
function copyInvite(){if(!SYNC.inviteCode)return;if(navigator.clipboard)navigator.clipboard.writeText(SYNC.inviteCode);toast('邀请码：'+SYNC.inviteCode+'（已尝试复制）');}
function teamSwitch(k){TEAM_TAB=k;renderSec();}
function renderTeam(c){
  if(!SYNC.token){
    c.innerHTML=`<div class="panel"><h2>我们的空间</h2><p class="desc">这是你和好友/家人共享的空间：共享待办、共享记账、共享相册；每个人还有独立私人空间。</p><p>要使用公共空间，请先到「云同步」选择 <b>自建服务器</b> 模式，注册或登录团队账号（注册时填好友的邀请码即可加入同一圈子）。</p><button class="btn primary" onclick="switchSec('dash')">前往云同步</button></div>`;
    return;
  }
  const mem=(SYNC.members||[]).map(m=>`<span class="tag ${m.isCreator?'sage':''}">${esc(m.username)}${m.isCreator?' · 创建者':''}</span>`).join('');
  const tab=(k,l)=>`<button class="${TEAM_TAB===k?'on':''}" onclick="teamSwitch('${k}')">${l}</button>`;
  const body= TEAM_TAB==='todo'?teamTodo(): TEAM_TAB==='ledger'?teamLedger(): teamAlbum();

function compressImage(file,maxW,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.82));};img.src=fr.result;};fr.readAsDataURL(file);}

function exportJSON(){

  const blob=new Blob([data],{type:'application/json'});

function importJSON(file){

  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      if(!obj||typeof obj!=='object')throw new Error('不是有效的备份文件');
      modal('<h3>导入备份</h3><p>这将用备份内容<strong>覆盖</strong>当前所有数据，且不可撤销。确定继续吗？</p><div class="acts"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" id="doImport">覆盖导入</button></div>');

function renderLedger(c){
  const t=TODAY(),month=monthKey(t);
  const monthOut=DB.ledger.filter(x=>x.io==='out'&&monthKey(x.date)===month).reduce((s,x)=>s+x.amount,0);
  const monthIn=DB.ledger.filter(x=>x.io==='in'&&monthKey(x.date)===month).reduce((s,x)=>s+x.amount,0);
  const budget=DB.budget||0;
  const over=budget&&monthOut>budget;
  const _pd=new Date(t+'T00:00:00');_pd.setDate(0);const prevMonth=_pd.toISOString().slice(0,7);
  const pmOut=DB.ledger.filter(x=>x.io==='out'&&monthKey(x.date)===prevMonth).reduce((s,x)=>s+x.amount,0);
  const pmIn=DB.ledger.filter(x=>x.io==='in'&&monthKey(x.date)===prevMonth).reduce((s,x)=>s+x.amount,0);

  // 消费结构（本月支出分类）
  const struct={};DB.ledger.filter(x=>x.io==='out'&&monthKey(x.date)===month).forEach(x=>{struct[x.cat]=(struct[x.cat]||0)+x.amount;});
  const structArr=Object.entries(struct).sort((a,b)=>b[1]-a[1]);

function barCompare(mi,mo,pi,po){
  const max=Math.max(mi,mo,pi,po,1);
  const bh=v=>Math.max(2,v/max*120);
  return `<svg viewBox="0 0 240 150" style="width:100%;height:auto">
    ${[['本月收入',mi,'var(--pos)'],['本月支出',mo,'var(--neg)'],['上月收入',pi,'color-mix(in srgb,var(--pos) 55%,var(--surface))'],['上月支出',po,'color-mix(in srgb,var(--neg) 55%,var(--surface))']].map((b,i)=>{
      const x=20+i*55;return `<rect x="${x}" y="${140-bh(b[1])}" width="34" height="${bh(b[1])}" rx="4" fill="${b[2]}"/>
      <text x="${x+17}" y="148" font-size="9" fill="var(--muted)" text-anchor="middle">${b[0].replace('本月','今').replace('上月','昨')}</text>
      <text x="${x+17}" y="${140-bh(b[1])-4}" font-size="8.5" fill="var(--ink-soft)" text-anchor="middle">${Math.round(b[1])}</text>`;
    }).join('')}
    <line x1="10" y1="140" x2="230" y2="140" stroke="var(--line-strong)"/></svg>`;
}
function donut(arr,total){
  if(!arr.length)return `<div class="empty">本月暂无支出</div>`;
  const r=54,c=2*Math.PI*r;let off=0;
  const segs=arr.map(([cat,v])=>{const len=v/total*c;const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${catColor(cat)}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return s;}).join('');
  const legend=arr.map(([cat,v])=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin:3px 0"><span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${catColor(cat)};margin-right:6px"></span>${cat}</span><span class="num">${money(v)} · ${Math.round(v/total*100)}%</span></div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 150 150" style="width:150px;height:150px;flex:0 0 150px"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${segs}<text x="75" y="72" font-size="11" fill="var(--muted)" text-anchor="middle">本月支出</text><text x="75" y="88" font-size="14" fill="var(--ink)" text-anchor="middle" font-family="var(--serif)">${Math.round(total)}</text></svg><div style="flex:1;min-width:140px">${legend}</div></div>`;
}
function renderLedgerList(){
  let list=DB.ledger.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(ledgerFilter.io!=='all')list=list.filter(x=>x.io===ledgerFilter.io);
  if(ledgerFilter.cat!=='all')list=list.filter(x=>x.cat===ledgerFilter.cat);

    ${list.map(x=>`<tr><td class="num">${x.date}</td><td><span class="tag ${x.io==='in'?'io-in':'io-out'}">${esc(x.cat)}</span></td>
    <td class="muted">${esc(x.note||'')}</td>
    <td style="text-align:right" class="num ${x.io==='in'?'amt-in':'amt-out'}">${x.io==='in'?'+':'-'}${money(x.amount).replace('¥','¥')}</td>

function addLedger(){
  const date=$('#lg_date').value||TODAY(),io=$('#lg_io').value,cat=$('#lg_cat').value;

function delLedger(id){DB.ledger=DB.ledger.filter(x=>x.id!==id);save();renderLedgerList();}
function exportExcel(){
  const rows=[['日期','类型','分类','金额','备注']];
  DB.ledger.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push([x.date,x.io==='in'?'收入':'支出',x.cat,x.amount,x.note||'']));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');

}

function renderHabits(c){
  let html=`<div class="panel"><h2>我的习惯</h2><p class="desc">三种打卡方式：勾选 / 计数 / 数值；下方为近 30 天热力图</p>
    <div class="inline-form">
      <div style="flex:1;min-width:140px"><label>习惯名称</label><input type="text" id="hb_name" placeholder="如：冥想"></div>
      <div style="flex:0 0 110px"><label>类型</label><select id="hb_type"><option value="check">勾选</option><option value="count">计数</option><option value="number">数值</option></select></div>
      <div style="flex:0 0 90px"><label>目标</label><input type="number" id="hb_target" value="1" step="1"></div>
      <div style="flex:0 0 100px"><label>单位</label><input type="text" id="hb_unit" placeholder="次/杯"></div>
      <button class="btn primary" onclick="addHabit()" style="flex:0 0 auto">新增习惯</button>
    </div>
    <div id="habitList"></div>
  </div>`;
  c.innerHTML=html;renderHabitList();
}
function renderHabitList(){
  const t=TODAY();const el=$('#habitList');
  if(!DB.habits.length){el.innerHTML=`<div class="empty">还没有习惯，添加一个开始吧</div>`;return;}
  el.innerHTML=DB.habits.map(h=>{
    const done=habitDoneToday(h);
    const val=h.records[t];
    // 近30天
    let cells='';for(let i=29;i>=0;i--){const d=addDays(t,-i);const v=h.records[d];let lvl=0;
      if(v!=null){if(h.type==='check')lvl=v>=1?1:0;else lvl=Math.min(4,Math.ceil((Number(v)/h.target)*4));}
      cells+=`<div class="cell" style="background:${lvl?catColor(h.name)+'cc':''};opacity:${lvl?0.4+lvl*0.15:1}" title="${d}:${v==null?'未打卡':v}"></div>`;}
    let act='';
    if(h.type==='check')act=`<button class="btn sm ${done?'primary':''}" onclick="checkHabit('${h.id}')">${done?'已完成':'打卡'}</button>`;
    else if(h.type==='count')act=`<button class="btn sm" onclick="incHabit('${h.id}',1)">+1</button><button class="btn sm" onclick="incHabit('${h.id}',-1)">-1</button><span class="num" style="min-width:34px;text-align:center">${val||0}</span>`;
    else act=`<input type="number" id="hn_${h.id}" value="${val||''}" placeholder="${h.target}" style="width:80px" onchange="setHabitNum('${h.id}',this.value)"><span class="muted">${h.unit}</span>`;
    const typeLabel={check:'勾选',count:'计数',number:'数值'}[h.type];
    return `<div class="habit">
      <div class="info"><div class="nm">${esc(h.name)}</div><div class="meta">类型：${typeLabel} · 目标 ${h.type==='check'?'完成':h.target+h.unit} ${done?'· <span style="color:var(--sage)">今日已达成</span>':''}</div>
        <div class="heat single" style="margin-top:10px">${cells}</div></div>
      <div class="acts">${act}<button class="iconbtn" onclick="delHabit('${h.id}')" title="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button></div>
    </div>`;
  }).join('');
}
function addHabit(){
  const name=$('#hb_name').value.trim();if(!name){toast('请输入习惯名称','err');return;}
  const type=$('#hb_type').value;const target=Math.max(1,parseInt($('#hb_target').value,10)||1);const unit=$('#hb_unit').value.trim();
  DB.habits.push({id:uid(),name,type,target,unit,records:{}});save();addCount();renderHabitList();$('#hb_name').value='';toast('已添加');
}
function checkHabit(id){const h=DB.habits.find(x=>x.id===id);if(!h)return;const t=TODAY();h.records[t]=h.records[t]===1?0:1;save();renderHabitList();}
function incHabit(id,d){const h=DB.habits.find(x=>x.id===id);if(!h)return;const t=TODAY();const cur=Number(h.records[t]||0);h.records[t]=Math.max(0,cur+d);save();renderHabitList();}
function setHabitNum(id,v){const h=DB.habits.find(x=>x.id===id);if(!h)return;const t=TODAY();h.records[t]=v===''?'':Math.max(0,parseFloat(v)||0);save();renderHabitList();}
function delHabit(id){DB.habits=DB.habits.filter(x=>x.id!==id);save();renderHabitList();}

/* ===================== 减脂健身 ===================== */
function renderFitness(c){
  const t=TODAY();
  const list=DB.fitness.slice().sort((a,b)=>a.date.localeCompare(b.date));

  let bmi='—',goalPct=0;

  const latestDeficit=latest?(latest.co||0)-(latest.ci||0):0;

  let html='';

      <div class="stat"><div class="v" style="color:${latestDeficit>=0?'var(--sage)':'var(--neg)'}">${latestDeficit>=0?'+':''}${latestDeficit}</div><div class="l">今日热量缺口(kcal)</div></div>
    </div>
    <div style="margin-top:14px"><div class="bar"><i style="width:${goalPct}%"></i></div><div class="muted" style="font-size:12px;margin-top:6px">距目标进度 ${Math.round(goalPct)}%</div></div>
  </div>`;

  html+=`<div class="panel"><h2>体重曲线</h2><p class="desc">实线为每日体重，虚线为 7 日移动平均</p>${lineChart(list,ma)}</div>`;

  html+=`<div class="panel"><h2>记录今日</h2><p class="desc">输入即保存</p>
    <div class="inline-form">
      <div style="flex:0 0 130px"><label>日期</label><input type="date" id="ft_date" value="${t}"></div>

      <div style="flex:0 0 110px"><label>体脂(%)</label><input type="number" id="ft_f" step="0.1" placeholder="23"></div>
      <div style="flex:0 0 120px"><label>摄入(kcal)</label><input type="number" id="ft_ci" step="10" placeholder="1800"></div>
      <div style="flex:0 0 120px"><label>消耗(kcal)</label><input type="number" id="ft_co" step="10" placeholder="2200"></div>
      <button class="btn primary" onclick="addFitness()" style="flex:0 0 auto">保存</button>
    </div>
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px">目标体重：<input type="number" id="ft_goal" value="${goalW}" step="0.5" style="width:90px;display:inline-block;font-size:14px" onchange="DB._goalW=parseFloat(this.value)||68;save();renderFitness($('#content'))"> kg · 热量缺口=消耗−摄入</div>
    <div id="fitList"></div>

  html+=`</div></div>`;

  html+=`<div class="foot-note">数据仅存于本机 · 减脂是场温柔的持久战</div>`;

}
function lineChart(list,ma){
  if(list.length<1)return `<div class="empty">暂无记录，先记一笔体重</div>`;
  const ws=list;
  const allW=ws.map(x=>x.weight).concat(ma.map(m=>m.v));
  const min=Math.min(...allW)-0.5,max=Math.max(...allW)+0.5;
  const W=520,H=180,pad=30;
  const X=i=>pad+(ws.length<=1?W/2:i/(ws.length-1)*(W-pad*2));
  const Y=v=>H-pad-((v-min)/(max-min))*(H-pad*2);
  const raw=ws.map((x,i)=>({x:X(i),y:Y(x.weight)}));
  const maRaw=ma.map(m=>{const i=ws.findIndex(z=>z.date===m.date);return {x:X(i),y:Y(m.v)};});
  const path=raw.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const maPath=maRaw.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const dots=raw.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="var(--accent)"/>`).join('');
  const lastRaw=raw[raw.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad/2}" y2="${H-pad}" stroke="var(--line-strong)"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--line-strong)"/>
    <path d="${maPath}" fill="none" stroke="var(--sage)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${dots}
    <text x="${lastRaw.x}" y="${lastRaw.y-8}" font-size="10" fill="var(--accent)" text-anchor="middle">${ws[ws.length-1].weight}kg</text>
    <text x="${pad}" y="${pad-8}" font-size="9" fill="var(--muted)">${max.toFixed(1)}</text>
    <text x="${pad}" y="${H-pad+12}" font-size="9" fill="var(--muted)">${min.toFixed(1)}</text>
    <text x="${pad}" y="${H-4}" font-size="9" fill="var(--muted)">${ws[0].date.slice(5)}</text>
    <text x="${W-pad}" y="${H-4}" font-size="9" fill="var(--muted)" text-anchor="end">${ws[ws.length-1].date.slice(5)}</text>
  </svg>`;
}

function addPlan(d){const text=prompt('添加 '+['周一','周二','周三','周四','周五','周六','周日'][d-1]+' 计划：');if(text&&text.trim()){if(!DB.plan[d])DB.plan[d]=[];DB.plan[d].push({id:uid(),text:text.trim()});save();renderFitness($('#content'));}}
function delPlan(d,id){DB.plan[d]=DB.plan[d].filter(x=>x.id!==id);save();renderFitness($('#content'));}

/* ===================== 日程统筹 ===================== */
function renderSchedule(c){
  const t=TODAY();
  let html=`<div class="panel"><h2>添加日程</h2><p class="desc">逾期未完成会自动标红并置顶</p>
    <div class="inline-form">
      <div style="flex:0 0 130px"><label>日期</label><input type="date" id="sc_date" value="${t}"></div>
      <div style="flex:0 0 100px"><label>时间</label><input type="time" id="sc_time" value="09:00"></div>
      <div style="flex:1;min-width:160px"><label>事项</label><input type="text" id="sc_title" placeholder="如：复诊"></div>
      <div style="flex:1;min-width:140px"><label>备注</label><input type="text" id="sc_note" placeholder="可选"></div>
      <button class="btn primary" onclick="addSched()" style="flex:0 0 auto">添加</button>
    </div>
    <div id="schedList"></div>
  </div>`;
  c.innerHTML=html;renderSchedList();
}
function renderSchedList(){
  const t=TODAY();const el=$('#schedList');
  const list=DB.schedule.slice().sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;return a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'');});
  if(!list.length){el.innerHTML=`<div class="empty">暂无日程</div>`;return;}
  el.innerHTML=list.map(x=>{const over=!x.done&&x.date<t;
    return `<div class="todo-item ${over?'overdue':''}">
      <button class="iconbtn" onclick="toggleSched('${x.id}')" style="font-size:20px;color:${x.done?'var(--sage)':'var(--muted)'}">${x.done?'☑':'☐'}</button>
      <div style="flex:1;min-width:0"><div class="t" style="${x.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.title)}</div>
        <div class="meta">${over?`<span class="due">逾期 ${x.date}</span>`:`${x.date} ${esc(x.time||'')}`} ${esc(x.note?'· '+x.note:'')}</div></div>
      <button class="iconbtn" onclick="delSched('${x.id}')" title="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
    </div>`;}).join('');
}
function addSched(){const date=$('#sc_date').value||TODAY();const time=$('#sc_time').value;const title=$('#sc_title').value.trim();const note=$('#sc_note').value.trim();if(!title){toast('请输入事项','err');return;}
  DB.schedule.push({id:uid(),date,time,title,note,done:false});save();addCount();renderSchedList();$('#sc_title').value='';$('#sc_note').value='';toast('已添加');}
function toggleSched(id){const x=DB.schedule.find(s=>s.id===id);if(x){x.done=!x.done;save();renderSchedList();}}
function delSched(id){DB.schedule=DB.schedule.filter(x=>x.id!==id);save();renderSchedList();}

/* ===================== 待买清单 ===================== */
function renderShopping(c){
  let html=`<div class="panel"><h2>待买清单</h2><p class="desc">勾选即购入，可分类</p>
    <div class="inline-form">
      <div style="flex:1;min-width:160px"><label>物品</label><input type="text" id="sh_name" placeholder="如：洗衣液"></div>
      <div style="flex:0 0 110px"><label>分类</label><input type="text" id="sh_cat" placeholder="日用"></div>
      <button class="btn primary" onclick="addShop()" style="flex:0 0 auto">加入清单</button>
    </div>
    <div id="shopList"></div>
  </div>`;
  c.innerHTML=html;renderShopList();
}
function renderShopList(){
  const el=$('#shopList');const list=DB.shopping.slice().sort((a,b)=>a.bought-b.bought);
  if(!list.length){el.innerHTML=`<div class="empty">清单是空的</div>`;return;}
  el.innerHTML=list.map(x=>`<div class="todo-item">
    <button class="iconbtn" onclick="toggleShop('${x.id}')" style="font-size:20px;color:${x.bought?'var(--sage)':'var(--muted)'}">${x.bought?'☑':'☐'}</button>
    <div style="flex:1;min-width:0"><div class="t" style="${x.bought?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.name)}</div>
      <div class="meta"><span class="tag">${esc(x.cat||'未分类')}</span></div></div>
    <button class="iconbtn" onclick="delShop('${x.id}')"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
  </div>`).join('');
}
function addShop(){const name=$('#sh_name').value.trim();if(!name){toast('请输入物品','err');return;}const cat=$('#sh_cat').value.trim();DB.shopping.push({id:uid(),name,cat,bought:false});save();addCount();renderShopList();$('#sh_name').value='';toast('已加入');}
function toggleShop(id){const x=DB.shopping.find(s=>s.id===id);if(x){x.bought=!x.bought;save();renderShopList();}}
function delShop(id){DB.shopping=DB.shopping.filter(x=>x.id!==id);save();renderShopList();}

/* ===================== 书影音收藏 ===================== */
function mediaCoverColor(title){let s=0;for(const ch of (title||''))s+=ch.charCodeAt(0);const cols=['#b06a47','#5f7a6e','#bb9a4e','#7a6a8f','#4a7c89','#bd5638'];return cols[s%cols.length];}
function renderMedia(c){
  const t=TODAY();
  const statusLabel={wish:'想看',ing:'在看',done:'看完'};
  const typeLabel={book:'书',movie:'影',music:'音'};
  // 年度统计
  const byYear={};DB.media.forEach(m=>{const y=(m.date||t).slice(0,4);byYear[y]=byYear[y]||{n:0,star:0,done:0};byYear[y].n++;byYear[y].star+=m.star||0;if(m.status==='done')byYear[y].done++;});
  const years=Object.keys(byYear).sort().reverse();
  let html='';
  html+=`<div class="panel"><h2>年度统计</h2><p class="desc">收藏 · 评分 · 完成度</p>
    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat"><div class="v">${DB.media.length}</div><div class="l">总收藏</div></div>
      <div class="stat"><div class="v">${DB.media.filter(m=>m.status==='wish').length}</div><div class="l">想看/想读</div></div>
      <div class="stat"><div class="v">${DB.media.filter(m=>m.status==='done').length}</div><div class="l">已看完</div></div>
      <div class="stat"><div class="v">${(DB.media.reduce((s,m)=>s+(m.star||0),0)/(DB.media.length||1)).toFixed(1)}</div><div class="l">平均星级</div></div>
    </div>
    ${years.length?`<div>${years.map(y=>`<div style="display:flex;gap:12px;align-items:center;font-size:13px;margin:6px 0"><span style="width:42px;color:var(--muted)">${y}</span><span class="num">${byYear[y].n} 件</span><span class="stars">${'★'.repeat(Math.round(byYear[y].star/byYear[y].n))}${'☆'.repeat(5-Math.round(byYear[y].star/byYear[y].n))}</span><span class="muted">均分 ${(byYear[y].star/byYear[y].n).toFixed(1)}</span></div>`).join('')}</div>`:'<div class="muted">暂无数据</div>'}
  </div>`;

  html+=`<div class="panel"><h2>添加收藏</h2><p class="desc">支持书 / 影 / 音，可填封面图链接或留空用色块</p>
    <div class="inline-form">
      <div style="flex:0 0 90px"><label>类型</label><select id="md_type"><option value="book">书</option><option value="movie">影</option><option value="music">音</option></select></div>
      <div style="flex:1;min-width:160px"><label>标题</label><input type="text" id="md_title" placeholder="作品名"></div>
      <div style="flex:0 0 110px"><label>状态</label><select id="md_status"><option value="wish">想看</option><option value="ing">在看</option><option value="done">看完</option></select></div>
      <div style="flex:0 0 90px"><label>星级</label><select id="md_star">${[0,1,2,3,4,5].map(s=>`<option value="${s}">${s}★</option>`).join('')}</select></div>
      <div style="flex:1;min-width:150px"><label>封面链接</label><input type="text" id="md_cover" placeholder="可选 https://"></div>
      <button class="btn primary" onclick="addMedia()" style="flex:0 0 auto">收藏</button>
    </div>
    <div style="flex:1;min-width:200px"><label>短评</label><input type="text" id="md_review" placeholder="一句话感受"></div>
    <div class="section-head" style="margin-top:18px"><h2 style="margin:0">封面墙</h2>
      <div class="seg"><button class="on" data-v="wall" onclick="switchMediaView(this,'wall')">封面墙</button><button data-v="list" onclick="switchMediaView(this,'list')">列表</button></div></div>
    <div id="mediaView"></div>
  </div>`;
  c.innerHTML=html;renderMediaView('wall');
}
function switchMediaView(btn,mode){
  $$('#content .seg button').forEach(b=>b.classList.toggle('on',b===btn));
  renderMediaView(mode);
}
function renderMediaView(mode){
  const el=$('#mediaView');const list=DB.media.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const typeLabel={book:'书',movie:'影',music:'音'};const statusLabel={wish:'想看',ing:'在看',done:'看完'};
  if(!list.length){el.innerHTML=`<div class="empty">还没有收藏</div>`;return;}
  if(mode==='wall'){
    el.innerHTML=`<div class="cover-wall">${list.map(m=>`<div class="cover" onclick="editMedia('${m.id}')">
      ${m.cover?`<img src="${esc(m.cover)}" onerror="this.parentNode.style.background='${mediaCoverColor(m.title)}';this.remove()">`:`<div style="position:absolute;inset:0;background:${mediaCoverColor(m.title)}"></div>`}
      <span class="badge">${typeLabel[m.type]}</span>${m.star?`<span class="star">${'★'.repeat(m.star)}</span>`:''}
      <div class="ph">${esc(m.title)}</div></div>`).join('')}</div>`;
  }else{
    el.innerHTML=list.map(m=>`<div class="list-row"><div class="ph" style="background:${mediaCoverColor(m.title)}">${typeLabel[m.type]}</div>
      <div class="body"><div class="tt">${esc(m.title)} <span class="tag sage">${statusLabel[m.status]}</span> ${m.star?`<span class="stars">${'★'.repeat(m.star)}${'☆'.repeat(5-m.star)}</span>`:''}</div>
      <div class="rv">${esc(m.review||'')} ${m.date?`<span class="muted">· ${m.date}</span>`:''}</div></div>
      <button class="iconbtn" onclick="delMedia('${m.id}')"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button></div>`).join('');
  }
}
function addMedia(){
  const type=$('#md_type').value;const title=$('#md_title').value.trim();if(!title){toast('请输入标题','err');return;}
  const status=$('#md_status').value;const star=parseInt($('#md_star').value,10);const cover=$('#md_cover').value.trim();const review=$('#md_review').value.trim();
  DB.media.push({id:uid(),type,title,status,star,cover,review,date:TODAY()});save();addCount();renderMedia($('#content'));toast('已收藏');
}
function delMedia(id){DB.media=DB.media.filter(x=>x.id!==id);save();renderMediaView($$('#content .seg button.on')[0]?.dataset.v||'wall');}
function editMedia(id){const m=DB.media.find(x=>x.id===id);if(!m)return;
  modal(`<h3>编辑收藏</h3>
    <label>标题</label><input type="text" id="em_title" value="${esc(m.title)}">
    <label style="margin-top:10px">状态</label><select id="em_status">${['wish','ing','done'].map(s=>`<option value="${s}" ${m.status===s?'selected':''}>${ {wish:'想看',ing:'在看',done:'看完'}[s]}</option>`).join('')}</select>
    <label style="margin-top:10px">星级</label><select id="em_star">${[0,1,2,3,4,5].map(s=>`<option value="${s}" ${m.star===s?'selected':''}>${s}★</option>`).join('')}</select>
    <label style="margin-top:10px">短评</label><input type="text" id="em_review" value="${esc(m.review||'')}">
    <div class="acts" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" id="em_ok">保存</button></div>`);
  $('#em_ok').onclick=()=>{m.title=$('#em_title').value.trim()||m.title;m.status=$('#em_status').value;m.star=parseInt($('#em_star').value,10);m.review=$('#em_review').value.trim();save();closeModal();renderMedia($('#content'));toast('已更新');};
}

/* ===================== 初始化 ===================== */
function initTheme(){const th=localStorage.getItem(KEY_THEME)||'light';document.documentElement.setAttribute('data-theme',th);}
function bind(){
  $$('#nav button,#mobileNav button').forEach(b=>b.addEventListener('click',()=>switchSec(b.dataset.sec)));
  $('#btnBackup').onclick=exportJSON;$('#topBackup').onclick=exportJSON;
  $('#btnImport').onclick=()=>$('#fileInput').click();$('#topImport').onclick=()=>$('#fileInput').click();
  $('#btnClearDemo').onclick=clearDemo;
  const toggleTheme=()=>{const cur=document.documentElement.getAttribute('data-theme');const nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem(KEY_THEME,nx);}catch(e){}};
  $('#btnTheme').onclick=toggleTheme;$('#topTheme').onclick=toggleTheme;
  $('#fileInput').addEventListener('change',e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';});
}
function corruptUI(){
  modal(`<h3>数据读取异常</h3><p>检测到本地存档已损坏或无法解析（可能因写入中断导致）。你可以选择<strong>导入备份恢复</strong>，或<strong>重置为空工作台</strong>。当前未损坏的备份文件仍可通过「导入恢复」载入。</p>
    <div class="acts"><button class="btn ghost" onclick="$('#fileInput').click();closeModal()">导入备份</button><button class="btn primary" id="corruptReset">重置清空</button></div>`);
  $('#corruptReset').onclick=()=>{DB=defaultDB();DB._demo=false;save();closeModal();renderAll();toast('已重置');};
}
function boot(){
  initTheme();bind();
  const ok=load();
  if(!ok){CORRUPT=true;}
  // 日期显示
  const d=new Date();$('#todayDate').textContent=d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  renderAll();
  // 恢复已有登录态：连接过云同步则拉取云端数据并启动轮询
  if(SYNC.provider==='gist'?SYNC.gistId:SYNC.token){
    if(SYNC.provider==='gist'){syncStart();syncPull();}
    else{
      fetch(syncBase()+'/api/data',{headers:{'Authorization':'Bearer '+SYNC.token}})
        .then(r=>{if(r.ok){afterLogin();}else{SYNC.token='';localStorage.removeItem('wb_life_token');renderAcct();renderSyncBox();}})
        .catch(()=>{});
    }
  }
  renderAcct();renderSyncBox();
  if(CORRUPT)setTimeout(corruptUI,300);
}
// 暴露给内联 onclick
Object.assign(window,{exportJSON,importJSON,clearDemo,resetAll,switchSec,renderLedger,renderHabits,renderFitness,renderSchedule,renderShopping,renderMedia,
  addLedger,delLedger,exportExcel,setBudget,addHabit,checkHabit,incHabit,setHabitNum,delHabit,

  addMedia,delMedia,editMedia,switchMediaView,closeModal,
  syncSetApi,syncRegister,syncLogin,syncLogout,syncPull,
  syncSetProvider,gistConnect,gistDisconnect,
  renderTeam,teamSwitch,addShareTodo,toggleShareTodo,delShareTodo,addShareLedger,delShareLedger,onShareAlbum,delShareAlbum,copyInvite});

// PWA：捕获安装提示，提供页面内「安装到本机」按钮（电脑/安卓通用）
let deferredPrompt=null;
const installBtn=document.getElementById('topInstall');
// 若已以 App 形态打开（桌面图标进入），则隐藏安装按钮
if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){ if(installBtn)installBtn.style.display='none'; }
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  if(installBtn)installBtn.style.display='';
});
window.addEventListener('appinstalled',()=>{
  if(installBtn)installBtn.style.display='none';
  toast('已安装为应用，可离线使用',2600);
});
window.installApp=async function(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    try{const {outcome}=await deferredPrompt.userChoice; if(outcome!=='accepted')toast('已取消安装');}catch(e){}
    deferredPrompt=null; return;
  }
  installGuide();
};
function installGuide(){
  const ua=navigator.userAgent;
  const isIOS=/iP(ad|hone|od)/.test(ua) && !window.MSStream;
  const isAndroid=/Android/i.test(ua);
  let steps;
  if(isAndroid){
    steps=`<p><b>用 Chrome 浏览器</b>打开本页面（微信/QQ 内置浏览器装不了，请点右上角「…」选「在浏览器打开」）。</p>
      <p><b>方式一（最推荐）</b>：地址栏右侧若出现 <b>「安装」向下箭头图标</b>，直接点它 → 选「安装」，桌面即出现<b>无角标</b>的「一二布布」图标。</p>
      <p><b>方式二</b>：点 Chrome 右上角 <b>「⋮ 菜单」</b> → 选 <b>「安装应用」</b>。<br>⚠️ 注意：<b>不要选「添加到主屏幕」</b>——那是浏览器书签，右下角会带 Chrome 角标，且无法去除。</p>`;
  }else if(isIOS){
    steps=`<p>① 用 <b>Safari</b> 打开本页面<br>② 点底部 <b>「分享」图标</b> → 选 <b>「添加到主屏幕」</b><br>③ 点「添加」，桌面即出现「一二布布」图标</p>`;
  }else{
    steps=`<p>① 用 <b>Chrome 或 Edge</b> 打开本页面<br>② 地址栏右侧会出现 <b>「安装」图标（向下箭头）</b>，点它即可；或在浏览器右上角 <b>「⋯ 菜单 → 应用 / 安装『一二布布』」</b></p>`;
  }
  modal(`<h3>安装「一二布布」到本机</h3>${steps}<div class="acts"><button class="btn primary" onclick="closeModal()">知道了</button></div>`);
}

// PWA：注册 Service Worker（仅 https/localhost 生效）
(function(){
  if(!('serviceWorker' in navigator))return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('发现新版本，刷新后生效'); // 温和提示，刷新即获得迭代
          }
        });
      });
    }).catch(()=>{});
  });
})();
boot();
</script>
