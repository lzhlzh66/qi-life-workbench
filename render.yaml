# Render.com 一键部署蓝图：连仓库即自动建服务，无需手动配置。
services:
  - type: web
    name: qi-life-workbench
    runtime: node
    plan: free
    buildCommand: "echo skip-build"
    startCommand: "node server.js"
    healthCheckPath: "/"
    envVars:
      - key: PORT
        sync: false
      - key: DATA_DIR
        value: /data
      # 以下两项为「加密云端备份」开关，留空＝不备份（本地/NAS 模式）；
      # 填了则在 GitHub Gist 存一份 AES 加密备份，防免费云主机磁盘丢失。
      - key: GIST_BACKUP_TOKEN
        sync: false
      - key: GIST_BACKUP_PASS
        sync: false
      # 以下两项用于 TWA 全屏（去除安卓 App 顶部地址栏）。
      # 拿到 PWABuilder 生成的签名 SHA256 指纹后填 ASSETLINKS_FP，
      # 包名 ASSETLINKS_PKG 一般保持默认即可。
      - key: ASSETLINKS_FP
        sync: false
      - key: ASSETLINKS_PKG
        sync: false
